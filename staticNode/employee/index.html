<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .employee-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .employee-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 250px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }
        .employee-card:hover {
            transform: translateY(-5px);
        }
        .employee-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }
        .employee-card h3 {
            margin: 10px 0 5px;
            color: #333;
        }
        .employee-card p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }
        .salary {
            font-weight: bold;
            color: #28a745 !important;
        }
        #loading {
            text-align: center;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Employee Directory</h1>
    <div id="loading">Loading employees...</div>
    <div class="employee-container" id="employee-container"></div>

    <script>
        async function fetchEmployees() {
            try {
                const response = await fetch('/api/employees');
                if (!response.ok) {
                    throw new Error('Failed to fetch employee data');
                }
                const employees = await response.json();
                
                const container = document.getElementById('employee-container');
                const loading = document.getElementById('loading');
                
                loading.style.display = 'none'; // Hide loading message
                
                employees.forEach(emp => {
                    const card = document.createElement('div');
                    card.className = 'employee-card';
                    card.innerHTML = `
                        <img src="${emp.profile_image}" alt="${emp.name}">
                        <h3>${emp.name}</h3>
                        <p><strong>Designation:</strong> ${emp.designation}</p>
                        <p><strong>Department:</strong> ${emp.department}</p>
                        <p class="salary">Salary: $${emp.salary.toLocaleString()}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching employees:', error);
                document.getElementById('loading').innerText = 'Failed to load employees. Please try again later.';
            }
        }

        // Fetch employees when the page loads
        window.onload = fetchEmployees;
    </script>
</body>
</html>
