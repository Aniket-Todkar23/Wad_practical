<!DOCTYPE html>
<html lang="en" ng-app="todoApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngularJS To-Do List</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        .task-list {
            list-style-type: none;
            padding: 0;
        }
        .task-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .task-list li:last-child {
            border-bottom: none;
        }
        .completed span {
            text-decoration: line-through;
            color: #888;
        }
        .input-group {
            display: flex;
            margin-bottom: 20px;
        }
        .input-group input[type="text"] {
            flex-grow: 1;
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-delete {
            background-color: #dc3545;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        .btn-edit {
            background-color: #ffc107;
            color: black;
            margin-right: 5px;
        }
        .btn-edit:hover {
            background-color: #e0a800;
        }
        .task-content {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }
        .task-content input[type="checkbox"] {
            margin-right: 10px;
        }
    </style>
</head>
<body ng-controller="TodoController">

    <h2>My To-Do List</h2>

    <div class="input-group">
        <input type="text" ng-model="newTaskText" placeholder="Add a new task..." ng-keyup="$event.keyCode == 13 ? addTask() : null">
        <button ng-click="addTask()">Add</button>
    </div>

    <ul class="task-list">
        <li ng-repeat="task in tasks" ng-class="{completed: task.done}">
            
            <!-- View Mode -->
            <div class="task-content" ng-show="!task.isEditing">
                <input type="checkbox" ng-model="task.done">
                <span>{{task.text}}</span>
            </div>
            
            <!-- Edit Mode -->
            <div class="task-content" ng-show="task.isEditing">
                <input type="text" ng-model="task.text" ng-keyup="$event.keyCode == 13 ? saveEdit(task) : null">
            </div>

            <div class="actions">
                <button class="btn-edit" ng-click="task.isEditing ? saveEdit(task) : editTask(task)">
                    {{task.isEditing ? 'Save' : 'Edit'}}
                </button>
                <button class="btn-delete" ng-click="deleteTask($index)">Delete</button>
            </div>
        </li>
    </ul>

    <script>
        var app = angular.module("todoApp", []);
        app.controller("TodoController", function($scope) {
            // Initial tasks
            $scope.tasks = [
                {text: "Learn AngularJS", done: false, isEditing: false},
                {text: "Build a To-Do App", done: false, isEditing: false}
            ];

            // Add new task
            $scope.addTask = function() {
                if($scope.newTaskText) {
                    $scope.tasks.push({text: $scope.newTaskText, done: false, isEditing: false});
                    $scope.newTaskText = ""; // Clear input
                }
            };

            // Delete task
            $scope.deleteTask = function(index) {
                $scope.tasks.splice(index, 1);
            };

            // Enable edit mode
            $scope.editTask = function(task) {
                task.isEditing = true;
            };

            // Save edited task
            $scope.saveEdit = function(task) {
                if (task.text.trim() === '') {
                    // if empty, let's just keep it, or we could delete it. Here we just stop editing.
                }
                task.isEditing = false;
            };
        });
    </script>
</body>
</html>
