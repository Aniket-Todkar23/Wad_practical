<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h3 class="text-center mb-4">Event Registration Form</h3>
                    
                    <form class="needs-validation" novalidate id="registrationForm">
                        
                        <!-- Full Name -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="fullName" placeholder="John Doe" required 
                                data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="Please enter your full legal name.">
                            <label for="fullName">Full Name</label>
                            <div class="invalid-feedback">
                                Please provide your full name.
                            </div>
                        </div>

                        <!-- Email Address -->
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required 
                                data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="We'll send your registration confirmation here.">
                            <label for="email">Email address</label>
                            <div class="invalid-feedback">
                                Please provide a valid email address.
                            </div>
                        </div>

                        <!-- Phone Number -->
                        <div class="form-floating mb-3">
                            <input type="tel" class="form-control" id="phone" placeholder="1234567890" pattern="[0-9]{10}" required 
                                data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="Enter a 10-digit phone number without spaces or dashes.">
                            <label for="phone">Phone Number</label>
                            <div class="invalid-feedback">
                                Please provide a valid 10-digit phone number.
                            </div>
                        </div>

                        <!-- Number of Tickets -->
                        <div class="form-floating mb-3">
                            <input type="number" class="form-control" id="tickets" placeholder="1" min="1" max="5" required 
                                data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="You can register for up to 5 tickets.">
                            <label for="tickets">Number of Tickets</label>
                            <div class="invalid-feedback">
                                Please select between 1 and 5 tickets.
                            </div>
                        </div>

                        <!-- Event Track Selection -->
                        <div class="form-floating mb-3">
                            <select class="form-select" id="eventTrack" required 
                                data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="Choose the main track you're interested in attending.">
                                <option value="" disabled selected>Select a track...</option>
                                <option value="technology">Technology & Innovation</option>
                                <option value="business">Business & Marketing</option>
                                <option value="design">Design & UX</option>
                            </select>
                            <label for="eventTrack">Event Track</label>
                            <div class="invalid-feedback">
                                Please select an event track.
                            </div>
                        </div>

                        <!-- Terms and Conditions -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" value="" id="termsCheck" required 
                                data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="You must agree to the terms to proceed.">
                            <label class="form-check-label" for="termsCheck">
                                I agree to the terms and conditions
                            </label>
                            <div class="invalid-feedback">
                                You must agree before submitting.
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mt-4">
                            <button class="btn btn-primary btn-lg" type="submit">Complete Registration</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle with Popper (required for tooltips) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Initialize tooltips
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));

    // Client-side form validation
    (() => {
        'use strict'
        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        const forms = document.querySelectorAll('.needs-validation')

        // Loop over them and prevent submission
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }

                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
