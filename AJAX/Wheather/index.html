<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Weather App</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #e0f7fa; }
        .weather-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); text-align: center; width: 300px; }
        input[type="text"] { width: 80%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; font-size: 1.1em; display: none; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 5px;}
        .error { color: red; margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div class="weather-card">
        <h2>Weather Search</h2>
        <input type="text" id="cityInput" placeholder="Enter city (e.g., London, Mumbai)">
        <br>
        <button onclick="getWeather()">Get Weather</button>

        <div id="weatherResult" class="result">
            <h3 id="cityNameWrapper" style="margin-top: 0; text-transform: capitalize;"></h3>
            <p><strong>Temperature:</strong> <span id="temp"></span></p>
            <p><strong>Humidity:</strong> <span id="humidity"></span></p>
            <p><strong>Conditions:</strong> <span id="conditions"></span></p>
        </div>

        <div id="errorMessage" class="error">City not found in local database.</div>
    </div>

    <script>
        function getWeather() {
            const cityInput = document.getElementById('cityInput').value.trim().toLowerCase();
            const resultDiv = document.getElementById('weatherResult');
            const errorDiv = document.getElementById('errorMessage');

            if (!cityInput) {
                alert("Please enter a city name.");
                return;
            }

            // Hide previous results/errors while loading
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';

            // AJAX call to fetch local weather data
            fetch('weather.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load JSON file');
                    }
                    return response.json();
                })
                .then(data => {
                    // Check if the city exists in our local map
                    if (data[cityInput]) {
                        const weatherData = data[cityInput];
                        
                        // Populate HTML with the fetched data
                        document.getElementById('cityNameWrapper').innerText = cityInput;
                        document.getElementById('temp').innerText = weatherData.temperature;
                        document.getElementById('humidity').innerText = weatherData.humidity;
                        document.getElementById('conditions').innerText = weatherData.conditions;
                        
                        // Show result div
                        resultDiv.style.display = 'block';
                    } else {
                        // City not found in our JSON
                        errorDiv.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    alert("Error loading the local data repository. Make sure you are using a local server (like Live Server or Express).");
                });
        }
    </script>
</body>
</html>
