<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        .nav-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-link">&larr; Back to Forms</a>
        <h2>Registered Users Data List</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>City</th>
                    <th>DOB</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Data will be inserted here via AJAX -->
            </tbody>
        </table>
    </div>

    <script>
        // Fetch users using AJAX GET request on page load
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/users')
                .then(res => res.json())
                .then(users => {
                    const tbody = document.getElementById('userTableBody');
                    
                    if (users.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No users registered yet.</td></tr>';
                        return;
                    }

                    users.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.mobile}</td>
                            <td>${user.city}</td>
                            <td>${user.dob}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error('Error fetching users:', err);
                    document.getElementById('userTableBody').innerHTML = '<tr><td colspan="5" style="color:red; text-align:center;">Failed to load data. Make sure the Node server is running.</td></tr>';
                });
        });
    </script>
</body>
</html>
